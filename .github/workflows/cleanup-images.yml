name: Cleanup GHCR

# 定期删除旧镜像版本，只保留最近若干个，避免 GHCR 空间无限增长
on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      # 一个包失败不影响另一个
      fail-fast: false
      matrix:
        package:
          - mahirofox-blog-next-frontend
          - mahirofox-blog-backend-go
    steps:
      - name: Delete old versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          # 每个包保留最近 10 个版本（含 latest）
          min-versions-to-keep: 10
          # 永远不删 latest，保证服务器随时可拉取
          ignore-versions: '^latest$'
          token: ${{ secrets.GITHUB_TOKEN }}
