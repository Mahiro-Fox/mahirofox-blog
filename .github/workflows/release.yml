name: Deploy

on:
  push:
    branches:
      - main

# 同一时间只允许一个部署，新提交会取消排队中的旧任务
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/mahiro-fox/mahirofox-blog-next-frontend
  BACKEND_IMAGE: ghcr.io/mahiro-fox/mahirofox-blog-backend-go

jobs:
  # 在 GitHub Runner 上构建镜像（4 核 / 16GB），服务器不再承担编译压力
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push next-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=next
          cache-to: type=gha,mode=max,scope=next

      - name: Build & push backend-go
        uses: docker/build-push-action@v6
        with:
          context: ./backend-go
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull images & restart on server
        uses: nekiro/ssh-job@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          user: ${{ secrets.SERVER_USER }}
          command: |
            cd /home/ubuntu/mahirofox-blog/
            git pull --rebase
            docker compose pull next-frontend backend-go
            docker compose up -d next-frontend backend-go
