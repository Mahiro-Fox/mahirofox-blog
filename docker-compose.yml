# 生产环境配置（也兼容开发环境基础需求）
# 开发时暴露额外端口用 docker-compose.override.yml（自动加载）
# 生产部署时只用本文件，端口仅对内暴露由 nginx 反代

# 固定 compose 项目名。默认取目录名，仓库目录一改名就会变成新项目：
# 数据卷跟着换名字（变成空库），而 container_name 是写死的，
# 新项目去创建同名容器就会报 "container name is already in use"。
name: mahirofox-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 生产不对外暴露 5432，仅在容器网络内可达
    # 如需本机调试，临时加端口映射或用 ssh 隧道
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend-go:
    # CI 构建并推送的镜像；保留 build 便于本地开发直接构建
    image: ghcr.io/mahiro-fox/mahirofox-blog-backend-go:latest
    build: ./backend-go
    container_name: mahiro-backend-go
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # 运行时必填项（缺失时后端拒绝启动）
      DATA_DIR: ${DATA_DIR}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
      ADMIN_ISSUER: ${ADMIN_ISSUER}
      USER_ISSUER: ${USER_ISSUER}
      # 可选：缺失时按 false 处理并输出告警
      SESSION_AUTO_RECOVER: ${SESSION_AUTO_RECOVER}
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  next-frontend:
    # CI 构建并推送的镜像；保留 build 便于本地开发直接构建
    image: ghcr.io/mahiro-fox/mahirofox-blog-next-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 公开变量必须在构建期注入（next.config.mjs 会校验）
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_UPLOADS_ORIGIN: ${NEXT_PUBLIC_UPLOADS_ORIGIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: mahiro-next-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_UPLOADS_ORIGIN: ${NEXT_PUBLIC_UPLOADS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GO_API_INTERNAL_URL: ${GO_API_INTERNAL_URL}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      # Turnstile：站点密钥为构建期内联（见上方 build.args），运行时只需 secret 与域名白名单
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES}
      # 可选：WebP 转换质量；留空时使用 sharp 默认质量并告警
      WEBP_QUALITY: ${WEBP_QUALITY}
      # 人机验证票据的 HMAC 签名密钥（src/lib/cloudflare/captcha-ticket.ts）。
      # 缺失时票据恒为空，登录流程会退回「每一步都验证」——不报错，只是白改。
      JWT_SECRET: ${JWT_SECRET}
      # uploads 静态资源已迁移到 Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      # Mastra 记忆存储连接串：指向 compose 内的 postgres 服务
      MASTRA_PG_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:3000:3000'
    # data 目录：大部分 JSON 已迁到 Go，只读即可；conversations 需动态写入单独挂载
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - backend-go
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
