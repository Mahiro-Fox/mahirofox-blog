# 生产环境配置（也兼容开发环境基础需求）
# 开发时暴露额外端口用 docker-compose.override.yml（自动加载）
# 生产部署时只用本文件，端口仅对内暴露由 nginx 反代

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 生产不对外暴露 5432，仅在容器网络内可达
    # 如需本机调试，临时加端口映射或用 ssh 隧道
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend-go:
    build: ./backend-go
    container_name: mahiro-backend-go
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  next-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahiro-next-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_UPLOADS_ORIGIN: ${NEXT_PUBLIC_UPLOADS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GO_API_INTERNAL_URL: ${GO_API_INTERNAL_URL}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      # uploads 静态资源已迁移到 Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      # Mastra 记忆存储连接串：指向 compose 内的 postgres 服务
      MASTRA_PG_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:3000:3000'
    # data 目录：大部分 JSON 已迁到 Go，只读即可；conversations 需动态写入单独挂载
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - backend-go
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
